server:
  port: 8080

spring:
  application:
    name: kacean-boot-standalone
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发默认连接；部署时通过环境变量覆盖，真实密码不写入仓库
    url: "${DB_URL:jdbc:mysql://localhost:3306/kacean_power?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  web:
    resources:
      # web 资源包：优先使用分发包外置 web/ 目录（可直接修改），jar 内 resources/web 兜底
      static-locations: file:./web/,classpath:/web/

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # 该地址提供跳转，实际页面为 /swagger-ui/index.html
    path: /swagger-ui.html

logging:
  # 默认加载 jar 内配置（本地 IDE 启动可用）；分发包启动脚本通过 --logging.config 指定外置 conf/logback-spring.xml 覆盖此项
  config: classpath:conf/logback-spring.xml
